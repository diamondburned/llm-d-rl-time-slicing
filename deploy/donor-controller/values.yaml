image:
  repository: ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/donor-controller
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  workers: 2
  idleTTL: 5m
  resyncPeriod: 10m
  dryRun: false
  # e.g. timeslice.io/shared=true:NoSchedule; empty disables W5
  isolationTaint: ""
  # host:port of the orchestrator's gRPC API, e.g.
  # timeslice-timesliceorchestrator.timeslice-system:50051. A shared host
  # stays shared while its group's lock is active. Empty: donor pods alone
  # decide.
  orchestratorAddr: ""
  groupLockPollInterval: 2s
  # Remove the guest kubelet's timeslice.io/gpu-fence taint from a host once
  # the virtual node it names has been gone for staleFenceGrace and no mirror
  # pod is left: a departed guest kubelet can no longer remove it itself.
  clearStaleFences: true
  staleFenceGrace: 1m
  leaderElect: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"

extraArgs: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
