apiVersion: apps/v1
kind: Deployment
metadata:
  name: guest-vllm
  namespace: rl-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guest-vllm
  template:
    metadata:
      labels:
        app: guest-vllm
        timeslice.io/guest: "true"
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.9.2
        command: ["vllm", "serve", "Qwen/Qwen2.5-0.5B-Instruct", "--port", "8000", "--gpu-memory-utilization", "0.6", "--max-model-len", "4096"]
        ports:
        - containerPort: 8000
        resources:
          requests:
            # The virtual node offers what the host has left after the
            # trainer's requests (guest-budget: computed); keep this small.
            cpu: "500m"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: guest-vllm
  namespace: rl-demo
spec:
  selector:
    app: guest-vllm
  ports:
  - port: 8000
    targetPort: 8000
