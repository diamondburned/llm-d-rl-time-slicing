apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-load-generator
  namespace: rl-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-load-generator
  template:
    metadata:
      labels:
        app: batch-load-generator
    spec:
      containers:
      - name: loadgen
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install --quiet requests
          python3 - <<'PY'
          import datetime, time, requests
          URL = "http://guest-vllm.rl-demo.svc.cluster.local:8000/v1/completions"
          PROMPT = "Explain why time-slicing improves GPU utilization in three sentences."
          MODEL = "Qwen/Qwen2.5-0.5B-Instruct"
          completed = errors = 0
          window = time.time()
          print("batch load generator started", flush=True)
          while True:
              try:
                  r = requests.post(URL, json={"model": MODEL, "prompt": PROMPT, "max_tokens": 48}, timeout=10)
                  if r.status_code == 200:
                      completed += 1
                  else:
                      errors += 1
              except Exception:
                  errors += 1
                  time.sleep(0.5)
              if time.time() - window >= 5.0:
                  ts = datetime.datetime.now().strftime("%H:%M:%S")
                  print(f"[{ts}] last 5s: completed={completed} errors_or_asleep={errors}", flush=True)
                  completed = errors = 0
                  window = time.time()
          PY
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
